# NAVCORE-SoOP configuration (APM/SOOP/soop.cfg)
# Format: key value (one per line, # for comments)

# Active antenna bias-tee feed (+5V on J12 MMCX via U24 load switch)
# 1 = enabled (default for flight with active antenna like Tallysman HC610)
# 0 = disabled (recommended for bench testing with signal generators, RTL-SDR,
#     or spectrum analyzers IF no external DC block is fitted)
# NOTE: If ant_feed is 1 on the bench, ALWAYS fit an inline SMA DC block between
# J12/pigtail and test equipment to prevent DC backfeed into instrument inputs.
ant_feed 1

# Baseband amplifier gain code (0-15; 0 = 0 dB, default)
bbg 0

# Elevation mask angle in degrees (satellites below this are excluded)
mask_deg 15.0

# Maximum TLE orbit age in days before rejecting ephemeris
max_tle_age_d 14.0

# Maximum horizontal accuracy estimate (m) to declare a 3D SoOP fix
fix_max_hacc 50.0

# UTC - UT1 time offset in seconds (DUT1); update from IERS Bulletin A
dut1 0.0

# IQ replay mode (0 = live tuner MAX2112, 1 = replay from APM/SOOP/replay.iq)
replay 0

# Swap I and Q channels (0 = normal, 1 = swapped)
swap_iq 0
