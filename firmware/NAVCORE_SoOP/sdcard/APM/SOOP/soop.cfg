#NAVCORE-SoOP settings: "key value", one per line; the values the simulations ran with
#antenna bias feed on J12; 0 on the bench unless a dc block is fitted
ant_feed 1
#MAX2112 baseband gain code, 0-15
bbg 4
#elevation mask, degrees
mask_deg 5
#oldest orbit accepted, days
max_tle_age_d 7
#largest horizontal sigma still published as a fix, m
fix_max_hacc 3000
#UT1 - UTC, s, from IERS Bulletin A
dut1 0
#1 replays APM/SOOP/replay.iq instead of the tuner
replay 0
#1 swaps I and Q
swap_iq 0
